<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A precision calculator built with HTML, SASS and JavaScript." />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <title>Calculator</title>
  </head>
  <body>
    <section class="section" aria-label="Calculator">
      <div class="calc-toolbar">
        <span class="calc-brand">Precision Instrument</span>
        <div class="calc-actions">
          <button class="btn--icon" data-history-toggle aria-label="Toggle calculation history" aria-expanded="false" title="Calculation History (Press H)">
            <span aria-hidden="true">⏱ History</span>
          </button>
        </div>
      </div>

      <div class="history-panel" data-history-panel aria-label="Calculation history">
        <div class="history-header">
          <span>Recent Calculations</span>
          <button type="button" class="btn--clear-history" data-clear-history aria-label="Clear calculation history">Clear</button>
        </div>
        <ul class="history-list" data-history-list></ul>
      </div>

      <header class="header">
        <div data-previous-operand class="previous-operand" aria-hidden="true"></div>
        <div data-current-operand class="current-operand" role="status" aria-live="polite">0</div>
      </header>

      <main class="main" role="group" aria-label="Calculator Keypad">
        <button type="button" class="btn--fn" data-all-clear aria-label="Clear all (Escape)">C</button>
        <button type="button" class="btn--fn" data-sym aria-label="Toggle sign">±</button>
        <button type="button" class="btn--fn" data-operation aria-label="Percent">%</button>
        <button type="button" class="btn--op" data-operation aria-label="Divide (/)">÷</button>

        <button type="button" class="btn--num" data-number>7</button>
        <button type="button" class="btn--num" data-number>8</button>
        <button type="button" class="btn--num" data-number>9</button>
        <button type="button" class="btn--op" data-operation aria-label="Multiply (*)">×</button>

        <button type="button" class="btn--num" data-number>4</button>
        <button type="button" class="btn--num" data-number>5</button>
        <button type="button" class="btn--num" data-number>6</button>
        <button type="button" class="btn--op" data-operation aria-label="Subtract (-)">-</button>

        <button type="button" class="btn--num" data-number>1</button>
        <button type="button" class="btn--num" data-number>2</button>
        <button type="button" class="btn--num" data-number>3</button>
        <button type="button" class="btn--op" data-operation aria-label="Add (+)">+</button>

        <button type="button" class="btn--num" data-number>0</button>
        <button type="button" class="btn--num" data-number aria-label="Decimal point (.)">.</button>
        <button type="button" class="btn--fn" data-delete aria-label="Delete last digit (Backspace)">⌫</button>
        <button type="button" class="btn--eq" data-equals aria-label="Equals (Enter)">=</button>
      </main>

      <p class="sign">by Sina</p>
    </section>
    <script src="app.js"></script>
  </body>
</html>
